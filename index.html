<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Master</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/themes.css">
  <style>
    .landing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 1.5rem;
    }

    .landing-container h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    #difficulty {
      padding: 0.5rem 1rem;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid var(--cell-border, #ccc);
      background-color: var(--bg-secondary, #f5f5f5);
      color: var(--cell-given, #333);
    }

    #startBtn {
      padding: 0.75rem 2rem;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: var(--cell-user, #2196f3);
      color: #fff;
      transition: background-color 0.2s ease;
    }

    #startBtn:hover {
      background-color: var(--cell-given, #1976d2);
    }
  </style>
  <script>
    (function () {
      const themes = ["light", "dark", "minimal", "competitive"];
      const saved = localStorage.getItem("theme");
      const theme = themes.includes(saved) ? saved : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>

<body>
  <div class="landing-container">
    <h1>Sudoku Master</h1>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
    <button id="startBtn">Start Game</button>
  </div>

  <script>
    document.getElementById("startBtn").onclick = () => {
      const diff = document.getElementById("difficulty").value;
      localStorage.setItem("difficulty", diff);
      localStorage.removeItem("sudokuState");
      window.location.href = "game.html";
    };
  </script>

</body>

</html>
